# Capriole on Flathub. The app is the .deb of a GitHub release, repackaged: building it from source here
# would need emsdk, cargo and npm offline, all inside flatpak-builder. The .deb's binary carries the web app
# and the engine (WebAssembly). OpenSC is built from source, so a smart card can be used from the sandbox
# (a module of the host would not load against the runtime's libraries). update.sh sets the release.
id: app.capriole.Capriole
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: capriole-desktop

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # Long-term signatures (B-LT, B-LTA): the time stamp, OCSP answers, CRLs (the shell's net_fetch). The
  # engine itself makes no request.
  - --share=network
  # Smart cards, through the host's pcscd.
  - --socket=pcsc

modules:
  # The PC/SC client library, which the runtime lacks (OpenSC needs winscard.h): the daemon is the host's,
  # reached through --socket=pcsc, so only libpcsclite is kept. Its protocol (4.6, falling back to 4.4) speaks
  # to the pcscd of today's distributions.
  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      # Where OpenSC's pkg-config and the app's loader look (meson would pick lib64).
      - --libdir=lib
      - -Dlibsystemd=false
      - -Dlibudev=false
      - -Dlibusb=false
      - -Dpolkit=false
      - -Dusb=false
      - -Dserial=false
    cleanup:
      - /bin
      - /sbin
      - /share/man
      - /share/doc
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.3.tar.xz
        sha256: fe2bb733ecf95e52768907eb00da9f9f3daf180960283e514a05dcc090afa3bd

  - name: opensc
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-doc
      - --disable-man
      - --disable-tests
      - --disable-notify
      - --sysconfdir=/app/etc
      # p11-kit's module list and the tools' Bash completion would go into the runtime's /usr, which is
      # read-only: into /app, and cleaned up (the app loads the module by its path).
      - --enable-p11_system_config_modules=/app/share/p11-kit/modules
      - --with-completiondir=/app/share/bash-completion/completions
    cleanup:
      - /bin
      - /include
      - /share/man
      - /share/doc
      - /share/bash-completion
      - /share/p11-kit
      - '*.la'
    sources:
      - type: archive
        url: https://github.com/OpenSC/OpenSC/releases/download/0.27.1/opensc-0.27.1.tar.gz
        sha256: 976f4a23eaf3397a1a2c3a7aac80bf971a8c3d829c9a79f06145bfaeeae5eca7

  - name: capriole
    buildsystem: simple
    sources:
      - type: file
        dest-filename: capriole.deb
        url: https://github.com/capriole-app/capriole/releases/download/v0.1.0/Capriole_amd64.deb
        sha256: b969fe2894f6c30ecc59706eea9433b6e79263cf756a5786ab4a4fbf9b11123e
        only-arches: [x86_64]
      - type: file
        path: app.capriole.Capriole.metainfo.xml
      - type: file
        path: app.capriole.Capriole.desktop
    build-commands:
      - ar -x capriole.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/capriole-desktop /app/bin/capriole-desktop
      - install -Dm644 app.capriole.Capriole.desktop /app/share/applications/app.capriole.Capriole.desktop
      - install -Dm644 app.capriole.Capriole.metainfo.xml /app/share/metainfo/app.capriole.Capriole.metainfo.xml
      - for size in 32x32 128x128 512x512; do install -Dm644 usr/share/icons/hicolor/$size/apps/capriole-desktop.png /app/share/icons/hicolor/$size/apps/app.capriole.Capriole.png; done
