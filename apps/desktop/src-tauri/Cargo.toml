[package]
name = "capriole-desktop"
version = "0.1.0"
description = "Capriole: PDF pages on the desktop (the web app in a Tauri shell)"
edition = "2021"
license = "0BSD"
publish = false

[lib]
name = "capriole_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
# A desktop app: small and fast, built rarely.
codegen-units = 1
lto = true
strip = true
