[package]
name = "capriole-desktop"
version = "0.4.2"
description = "Capriole: PDF pages on the desktop (the web app in a Tauri shell)"
edition = "2021"
license = "0BSD"
publish = false

[lib]
name = "capriole_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cryptoki = "0.12.1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
ureq = "3.4.2"

[profile.release]
# A desktop app: small and fast, built rarely.
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
# The IPC, with the app's own capabilities, in a mock runtime (src/lib.rs's tests).
serde_json = "1"
tauri = { version = "2", features = ["test"] }
