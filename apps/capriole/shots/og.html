<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The Open Graph image (1200 × 630), filled in by shots.spec.ts: the logo, the landing's headline,
         its line, and the text scene's screenshot, cut by the right edge. -->
    <style>
      @font-face {
        font-family: 'Inter Variable';
        src: url('%font%') format('woff2');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f7f7f4;
        font-family: 'Inter Variable', system-ui, sans-serif;
        color: #111d4a;
      }
      .text {
        position: absolute;
        left: 72px;
        top: 72px;
        width: 520px;
      }
      img.logo {
        height: 56px;
      }
      h1 {
        margin: 56px 0 24px;
        font-size: 54px;
        line-height: 1.08;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 24px;
        line-height: 1.4;
        color: #4a4f60;
      }
      .shot {
        position: absolute;
        left: 640px;
        top: 72px;
        width: 960px;
        border: 1px solid #dcdbd3;
        border-radius: 14px;
        box-shadow: 0 30px 60px -30px rgba(17, 29, 74, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="text">
      <img class="logo" src="/logo-light.svg" alt="" />
      <h1>%title%</h1>
      <p>%line%</p>
    </div>
    <img class="shot" src="%shot%" alt="" />
  </body>
</html>
